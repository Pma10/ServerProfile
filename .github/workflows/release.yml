name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example: 0.5.0-beta.1)'
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    name: Build Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.20'
          - '1.20.1'
          - '1.20.2'
          - '1.20.3'
          - '1.20.4'
          - '1.20.5'
          - '1.20.6'
          - '1.21'
          - '1.21.1'
          - '1.21.2'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
          - '26.1'
          - '26.2'
          - '26.3'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Resolve release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: gradle ":${{ matrix.minecraft }}:build" -Pmod_version="$VERSION" --stacktrace

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: release-mc${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}/build/libs/server-profile-*.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-sources.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-dev.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Ensure release does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 1
          fi

      - name: Download all version JARs
        uses: actions/download-artifact@v4
        with:
          pattern: release-mc*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f -name '*.jar' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi
          gh release create "$TAG"             release/*             --target "$GITHUB_SHA"             --title "ServerProfile $VERSION"             --generate-notes             "${EXTRA_ARGS[@]}"


  publish_modrinth:
    if: >-
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')) &&
      vars.MODRINTH_PROJECT_ID != ''
    needs: [build, release]
    name: Publish Modrinth / Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.20'
          - '1.20.1'
          - '1.20.2'
          - '1.20.3'
          - '1.20.4'
          - '1.20.5'
          - '1.20.6'
          - '1.21'
          - '1.21.1'
          - '1.21.2'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
          - '26.1'
          - '26.2'
          - '26.3'

    steps:
      - uses: actions/checkout@v4

      - name: Resolve publish metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          fi

          if [[ "$VERSION" == *alpha* ]]; then
            VERSION_TYPE="alpha"
          elif [[ "$VERSION" == *-* ]]; then
            VERSION_TYPE="beta"
          else
            VERSION_TYPE="release"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_TYPE=$VERSION_TYPE" >> "$GITHUB_ENV"

      - name: Verify Modrinth credentials
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "MODRINTH_TOKEN is not configured."
            exit 1
          fi

      - name: Download Minecraft ${{ matrix.minecraft }} JAR
        uses: actions/download-artifact@v4
        with:
          name: release-mc${{ matrix.minecraft }}
          path: modrinth

      - name: Prepare Modrinth changelog
        shell: bash
        run: |
          awk -v version="$VERSION" '
            index($0, "## " version " ") == 1 { printing=1; next }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md > modrinth-changelog.md

          if [ ! -s modrinth-changelog.md ]; then
            echo "ServerProfile $VERSION" > modrinth-changelog.md
          fi

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: modrinth/*.jar
          name: ServerProfile ${{ env.VERSION }} for Minecraft ${{ matrix.minecraft }}
          version: ${{ env.VERSION }}+${{ matrix.minecraft }}
          version-type: ${{ env.VERSION_TYPE }}
          changelog-file: modrinth-changelog.md

          loaders: fabric
          game-versions: ${{ matrix.minecraft }}
          game-version-filter: none
          environment: client

          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
            modmenu(optional){modrinth:mOgUt4GM}

          retry-attempts: 3
          retry-delay: 10000
          fail-mode: fail
