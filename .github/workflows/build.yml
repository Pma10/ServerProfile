name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.20'
          - '1.20.1'
          - '1.20.2'
          - '1.20.3'
          - '1.20.4'
          - '1.20.5'
          - '1.20.6'
          - '1.21'
          - '1.21.1'
          - '1.21.2'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
          - '26.1'
          - '26.2'
          - '26.3'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build
        run: gradle ":${{ matrix.minecraft }}:build" --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: server-profile-mc${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}/build/libs/server-profile-*.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-sources.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-dev.jar
          if-no-files-found: error
